<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Markdown Live Previewer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Markdown Live Previewer</h1>
    <button id="clear-btn" title="Clear the editor and saved draft">Clear</button>
  </header>

  <main class="split">
    <section class="pane">
      <label for="editor">Markdown</label>
      <textarea id="editor" spellcheck="false" placeholder="# Start typing Markdown..."></textarea>
    </section>

    <section class="pane">
      <label for="preview">Preview</label>
      <div id="preview" class="preview"></div>
    </section>
  </main>

  <footer>
    <span id="status">Draft restored from localStorage will show here.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
